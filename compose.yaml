# Stack de prod. En dev, superposer les Caméras simulées : compose.simulation.yaml.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"  # RTSP
      - "8189:8189/udp"  # WebRTC (ICE, média chiffré en DTLS-SRTP)
      # 8888 (HLS) et 8889 (WHEP) non publiés : relayés par web sous l'origine HTTPS (/flux).
      # 9997 (API de contrôle, pilotée par api) volontairement non publié : réseau Compose seulement (docs/securite.md).
    environment:
      # localhost toujours ; IP de la machine (réseau local) depuis .env, voir .env.example.
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1${MTX_WEBRTCADDITIONALHOSTS:+,${MTX_WEBRTCADDITIONALHOSTS}}

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      certificats:
        condition: service_completed_successfully
    volumes:
      # Partie publique de l'Autorité seule : la Détection vérifie l'hôte du Site en HTTPS (argos_api/soi.py).
      - type: volume
        source: certificats-serveur
        target: /etc/argos/argos-ca.crt
        read_only: true
        volume:
          subpath: argos-ca.crt
    # Aucun port publié : l'API n'est servie que par web, sous l'origine HTTPS (/api).
    environment:
      # Compte de l'Administrateur : voir .env.example.
      ARGOS_IDENTIFIANT: ${ARGOS_IDENTIFIANT:-}
      ARGOS_MOT_DE_PASSE: ${ARGOS_MOT_DE_PASSE:-}
      ARGOS_URL_BASE: postgresql+psycopg://argos:argos@db:5432/argos
      # Sonde de l'état des Caméras : voir .env.example.
      ARGOS_SONDE_INTERVALLE_S: ${ARGOS_SONDE_INTERVALLE_S:-10}
      ARGOS_SONDE_DELAI_S: ${ARGOS_SONDE_DELAI_S:-5}
      # Port HTTPS publié par web : la Détection y reconnaît l'hôte du Site (argos_api/soi.py).
      ARGOS_PORT_HTTPS: ${ARGOS_PORT_HTTPS:-443}
      # Détection des Caméras : sous-réseaux autorisés et ports sondés, voir .env.example. Vide : non configurée.
      ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX: ${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX:-}
      ARGOS_DETECTION_CAMERAS_PORTS: ${ARGOS_DETECTION_CAMERAS_PORTS:-554,8554}
      # Aperçu retiré sans renouvellement de l'UI pendant ce délai, en secondes : voir .env.example.
      ARGOS_APERCU_EXPIRATION_S: ${ARGOS_APERCU_EXPIRATION_S:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Ponctuel, avant web : Autorité du Site et certificat serveur (docs/adr/0005-https-par-une-origine-unique-et-une-autorite-du-site.md).
  certificats:
    build: ./certificats
    restart: "no"
    environment:
      # Noms du certificat serveur, en plus de localhost et 127.0.0.1 : IP du Site sur le réseau local.
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTCADDITIONALHOSTS:-}
    volumes:
      # Clé de l'Autorité : montée ici seulement, jamais dans web.
      - autorite:/autorite
      - certificats-serveur:/certificats-serveur

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      certificats:
        condition: service_completed_successfully
    ports:
      - "${ARGOS_PORT_HTTPS:-443}:443"  # Le Site : UI, API (/api) et Live (/flux) sous une seule origine HTTPS
      - "${ARGOS_PORT_HTTP:-80}:8080"  # Redirection vers HTTPS ; partie publique de l'Autorité (/argos-ca.crt)
      - "${ARGOS_PORT_HTTP_ANCIEN:-8080}:8080"  # Ancienne adresse de l'UI : même rôle que le port 80
    environment:
      # Port HTTPS publié, repris dans les redirections.
      ARGOS_PORT_HTTPS: ${ARGOS_PORT_HTTPS:-443}
    volumes:
      # Certificat serveur, sa clé et partie publique de l'Autorité ; lecture seule.
      - certificats-serveur:/etc/nginx/certificats:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    # Aucun port publié : seul api joint la base, par le réseau interne de Compose (docs/securite.md).
    # Le mot de passe ne protège donc que ce réseau interne.
    environment:
      POSTGRES_USER: argos
      POSTGRES_PASSWORD: argos
      POSTGRES_DB: argos
    volumes:
      - donnees-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "argos", "-d", "argos"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  donnees-db:
  autorite:
  certificats-serveur:
