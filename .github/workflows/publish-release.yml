# Canal production : retaggue le digest :staging vers X.Y.Z et :latest (sans rebuild),
# et joint l'artefact du Site. Déclenchement manuel : attendre que « Publier images staging »
# soit vert pour le SHA voulu, puis lancer ce workflow avec le tag vX.Y.Z.
name: Promouvoir images vers Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de Release déjà publiée (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: promouvoir-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promouvoir-release:
    name: Promouvoir staging vers la Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          ARGOS_RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/promouvoir-images-release.sh
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGOS_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/assembler-artefact-site.sh argos-site.tar.gz
          # Remplace l'artefact s'il existe déjà (re-promo / Release créée plus tôt).
          gh release delete-asset "${ARGOS_RELEASE_TAG}" argos-site.tar.gz --yes 2>/dev/null || true
          gh release upload "${ARGOS_RELEASE_TAG}" argos-site.tar.gz
