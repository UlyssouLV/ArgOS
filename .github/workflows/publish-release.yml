# Canal production : une GitHub Release vX.Y.Z retaggue le digest :staging
# (même digest, pas de rebuild) vers X.Y.Z et :latest, et joint l'artefact du Site.
name: Promouvoir images vers Release

on:
  release:
    types:
      - published

concurrency:
  group: promouvoir-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  promouvoir-release:
    name: Promouvoir staging vers la Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/promouvoir-images-release.sh
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/assembler-artefact-site.sh argos-site.tar.gz
          gh release upload "${{ github.event.release.tag_name }}" argos-site.tar.gz
