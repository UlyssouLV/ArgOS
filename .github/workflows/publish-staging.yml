# Canal staging : après une suite verte sur main, pousse :staging (pas de rebuild à la Release).
# Paquets publics : GHCR crée les images en privé ; après la première poussée, Danger Zone →
# Change visibility → Public pour argos-api, argos-web, argos-pont, argos-certificats
# (tirables ensuite sans authentification). L'API GitHub ne change pas cette visibilité.
name: Publier images staging

on:
  push:
    branches:
      - main

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  argos-tests:
    name: ArgOS tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lancer-les-tests.sh

  publier-staging:
    name: "Publier :staging"
    needs: argos-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/publier-images-staging.sh
