# Canal staging (early access) : digests :staging pour /th après review + quality gate.
# Déclenché depuis la branche de version (skill `/ps`), pas depuis main.
# Paquets publics : GHCR crée les images en privé ; après la première poussée, Danger Zone →
# Change visibility → Public pour argos-api, argos-web, argos-pont, argos-certificats, argos-temps
# (tirables ensuite sans authentification). L'API GitHub ne change pas cette visibilité.
name: Publier images staging

on:
  workflow_dispatch:

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  publier-staging:
    name: "Publier :staging"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/publier-images-staging.sh
