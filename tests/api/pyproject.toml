[project]
name = "argos-tests-api"
version = "0.2.0"
description = "Tests HTTP de l'API du Site contre la stack lancée (vus de l'extérieur)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
