[project]
name = "argos-tests-web"
version = "0.3.0"
description = "Tests de bout en bout de l'UI dans Chromium headless, contre la stack lancée."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-playwright>=0.7", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
base_url = "http://localhost:8080"
