# MediaMTX : pont vers le navigateur pour toute Caméra active (docs/adr/0001-mediamtx-en-pont.md).
# Aucun chemin ici : l'API du Site réconcilie les chemins camera-<id> par l'API de contrôle.
# Les Caméras simulées de dev sont des hôtes à part (compose.simulation.yaml).

rtspAddress: :8554
hlsAddress: :8888
# Flux H.265 (docs/adr/0004-hls-pour-les-flux-h265.md) : LL-HLS en fMP4, images remballées sans réencodage.
hlsVariant: lowLatency
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Candidats ICE annoncés aux navigateurs : voir MTX_WEBRTCADDITIONALHOSTS dans compose.yaml.

rtmp: no
srt: no
moq: no

# API de contrôle : port non publié dans compose.yaml, seulement joignable par le réseau Compose (docs/securite.md).
api: yes
apiAddress: :9997

authInternalUsers:
  # Lecture sans authentification propre : WHEP et HLS ne sont joignables que par le réseau Compose, et nginx ne les
  # relaie qu'à une session ArgOS valide (docs/adr/0006-flux-authentifies-par-nginx.md, docs/securite.md).
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback
  # API de contrôle ouverte à tout le réseau Compose : seul le port non publié la protège.
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
