# MediaMTX : pont vers le navigateur pour toute Caméra active (docs/adr/0001-mediamtx-en-pont.md).
# Aucun chemin ici : l'API du Site réconcilie les chemins camera-<id> par l'API de contrôle.
# Les Caméras simulées de dev sont des hôtes à part (compose.simulation.yaml).

rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Candidats ICE annoncés aux navigateurs : voir MTX_WEBRTCADDITIONALHOSTS dans compose.yaml.

rtmp: no
srt: no
moq: no

# API de contrôle : port non publié dans compose.yaml, seulement joignable par le réseau Compose (docs/securite.md).
api: yes
apiAddress: :9997

authInternalUsers:
  # Lecture des Flux sans authentification (dette connue, docs/securite.md).
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback
  # API de contrôle ouverte à tout le réseau Compose : seul le port non publié la protège.
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
