# Caméra simulée de dev (compose.simulation.yaml) : un hôte qui diffuse sa vidéo (media/simulated/camN.mp4,
# montée en /media/video.mp4) en boucle en RTSP sur le port 554, sur un seul chemin : sans réencodage, sauf pour
# incruster la date d'une Caméra simulée ONVIF (diffuser.sh).
# Gabarit : au démarrage, CHEMIN_FLUX y est remplacé par le chemin propre à chaque Caméra simulée
# (variable CHEMIN_FLUX dans compose.simulation.yaml), MediaMTX ne sachant pas nommer un chemin à `/` par variable.
# Lecture sans identifiants par défaut ; camera-simulee-2 les exige (MTX_AUTHINTERNALUSERS_0_* dans compose.simulation.yaml).

rtspAddress: :554
rtsp: yes
hls: no
webrtc: no
rtmp: no
srt: no
moq: no
api: no

authInternalUsers:
  # Lecture : remplacé pour camera-simulee-2 (identifiant et mot de passe de dev, media/simulated/README.md).
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
  # Dans le conteneur seulement : ffmpeg publie la vidéo, le healthcheck la lit sans identifiants.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read

paths:
  CHEMIN_FLUX:
    # Copie de flux, ou date de la caméra incrustée pour une Caméra simulée ONVIF (diffuser.sh).
    runOnInit: /diffuser.sh
    runOnInitRestart: yes
