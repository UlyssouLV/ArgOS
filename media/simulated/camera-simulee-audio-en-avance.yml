# Caméra simulée de dev à l'audio en avance (camera-simulee-6 de compose.simulation.yaml), comme Cam 01 : un hôte qui
# diffuse en RTSP sur le port 554, sur un seul chemin, une vidéo H.265 et un audio G.711 dont l'horodatage prend
# AVANCE_AUDIO_S secondes d'avance sur la vidéo au début de chaque lecture (ADR 0018, « Un Segment par fenêtre »).
# Gabarit : CHEMIN_FLUX y est remplacé au démarrage, comme dans camera-simulee.yml.
#
# Le pont aligne les pistes à l'arrivée de leur premier paquet : un écart constant s'efface, seul compte celui qui se
# creuse pendant sa lecture. Le chemin ne s'ouvre donc qu'à la demande d'un lecteur (le pont, la sonde, l'essai), et
# l'audio ne part qu'une fois le chemin ouvert : son avance se creuse sous les yeux du lecteur qui l'a ouvert.

rtspAddress: :554
rtsp: yes
hls: no
webrtc: no
rtmp: no
srt: no
moq: no
api: no

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read

paths:
  CHEMIN_FLUX:
    # Les deux pistes, chacune envoyée par son ffmpeg (diffuser-audio-en-avance.sh), sur un seul port, triées par
    # type de charge : 96 la vidéo, 0 l'audio G.711 µ-law.
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=Camera simulee
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H265/90000
      m=audio 5004 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
    sourceOnDemand: yes
    # Refermé vite sans lecteur : le lecteur suivant rouvre le chemin, et l'audio reprend sa course en avance.
    sourceOnDemandCloseAfter: 1s
    # La vidéo part en continu (perdue tant que le chemin est fermé) ; l'audio, à chaque ouverture, arrêté à la fermeture.
    runOnInit: /diffuser-audio-en-avance.sh video
    runOnInitRestart: yes
    runOnAvailable: /diffuser-audio-en-avance.sh audio
    runOnAvailableRestart: yes
