# Partie publique de l'Autorité du Site, servie en HTTP (premier téléchargement sur un poste) et en HTTPS.
# Absente avec un certificat fourni par l'Administrateur : /argos-ca.crt répond alors 404.
location = /argos-ca.crt {
    types { }
    default_type application/x-x509-ca-cert;
    alias /etc/nginx/certificats/argos-ca.crt;
}
