# Simulation de dev, superposée à compose.yaml (jamais en prod) :
#   docker compose -f compose.yaml -f compose.simulation.yaml up -d --build --wait
# Quatre Caméras simulées, quatre hôtes distincts comme de vraies caméras : chacune diffuse sa vidéo
# (media/simulated/camN.mp4) en boucle, en RTSP (port 554), sur un chemin de vraie caméra :
# style Hikvision (1), style Dahua avec identifiants (2), chemin exotique `flux` (3), style Hikvision en H.265 (4).
# Aucun port publié : on les regarde par le Live, une fois déclarées comme Caméras (media/simulated/README.md).
# MAC et IP fixes, comme l'étiquette et le bail d'une vraie caméra : la Détection et l'essai les lisent.
# Les Caméras simulées 2 et 4 répondent aussi en ONVIF (simulation/onvif/README.md) : leur Flux, réencodé, porte la
# date et l'heure de leur horloge, qu'elles calent en NTP sur temps quand le Site les cale (Heure du Site).

x-camera-simulee: &camera-simulee
  # MediaMTX et ffmpeg, plus une police pour incruster la date (media/simulated/Dockerfile).
  build: ./media/simulated
  restart: unless-stopped
  # Remplit le gabarit camera-simulee.yml avec le chemin de la Caméra simulée, puis lance MediaMTX.
  entrypoint: ["/bin/sh", "-c", "sed \"s|^  CHEMIN_FLUX:|  $$CHEMIN_FLUX:|\" /camera-simulee.yml > /tmp/mediamtx.yml && exec /mediamtx /tmp/mediamtx.yml"]
  healthcheck:
    # Prête quand la vidéo est diffusée sur son chemin.
    test: ["CMD-SHELL", "ffprobe -v error -rtsp_transport tcp \"rtsp://localhost/$$CHEMIN_FLUX\""]
    interval: 10s
    timeout: 5s
    start_period: 30s
    start_interval: 1s

services:
  camera-simulee-1:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.11
        mac_address: "02:a6:05:00:00:01"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/diffuser.sh:/diffuser.sh:ro
      - ./media/simulated/cam1.mp4:/media/video.mp4:ro
    environment:
      CHEMIN_FLUX: Streaming/Channels/101

  camera-simulee-2:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.12
        mac_address: "02:a6:05:00:00:02"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/diffuser.sh:/diffuser.sh:ro
      - ./media/simulated/cam2.mp4:/media/video.mp4:ro
      # Date de son horloge, écrite par camera-simulee-2-onvif, incrustée dans le Flux.
      - camera-simulee-2-horloge:/horloge:ro
    environment:
      FICHIER_DATE: /horloge/date.txt
      # Lu sur rtsp://camera-simulee-2/cam/realmonitor?channel=1&subtype=0 : MediaMTX ignore la requête.
      CHEMIN_FLUX: cam/realmonitor
      # Lecture avec identifiant et mot de passe de dev (media/simulated/README.md).
      MTX_AUTHINTERNALUSERS_0_USER: admin
      MTX_AUTHINTERNALUSERS_0_PASS: argos-simulee

  camera-simulee-3:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.13
        mac_address: "02:a6:05:00:00:03"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/diffuser.sh:/diffuser.sh:ro
      - ./media/simulated/cam3.mp4:/media/video.mp4:ro
    environment:
      CHEMIN_FLUX: flux

  camera-simulee-4:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.14
        mac_address: "02:a6:05:00:00:04"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/diffuser.sh:/diffuser.sh:ro
      # cam1.mp4 réencodée en H.265 : diffusée telle quelle, comme une vraie caméra HEVC.
      - ./media/simulated/cam4.mp4:/media/video.mp4:ro
      # Date de son horloge, écrite par camera-simulee-4-onvif, incrustée dans le Flux.
      - camera-simulee-4-horloge:/horloge:ro
    environment:
      FICHIER_DATE: /horloge/date.txt
      CHEMIN_FLUX: Streaming/Channels/101
      # Annonce aussi une piste audio PCM (`ipcm` dans les Segments), comme la caméra H.265 réelle du bug #141.
      AUDIO_IPCM: "1"

  # Interfaces ONVIF des Caméras simulées 2 et 4 (simulation/onvif/README.md) : chacune partage le réseau de sa
  # Caméra simulée, donc son IP et sa MAC, comme l'interface ONVIF d'une vraie caméra. Les 1 et 3 n'en ont pas.
  camera-simulee-2-onvif:
    build: ./simulation/onvif
    restart: unless-stopped
    network_mode: service:camera-simulee-2
    volumes:
      # Certificat auto-signé créé au premier démarrage, gardé ensuite : sa clé ne change pas d'un démarrage à l'autre.
      - camera-simulee-2-onvif-certificat:/certificat
      - camera-simulee-2-horloge:/horloge
    environment:
      # Date incrustée dans le Flux de camera-simulee-2 (media/simulated/diffuser.sh).
      ONVIF_FICHIER_DATE: /horloge/date.txt
      # HTTPS sur 443, et HTTP gardé sur le port des caméras XiongMai, comme beaucoup de vraies caméras. Les tests
      # retirent HTTPS (`ONVIF_PORT_HTTPS_2` vide) pour simuler une caméra qui ne répond plus qu'en HTTP.
      ONVIF_PORT_HTTPS: ${ONVIF_PORT_HTTPS_2-443}
      # Les tests le placent hors du volume pour simuler une autre clé à la même adresse (remise en usine…).
      ONVIF_CERTIFICAT: ${ONVIF_CERTIFICAT_2:-/certificat/certificat.pem}
      ONVIF_CLE: ${ONVIF_CLE_2:-/certificat/cle.pem}
      ONVIF_PORT: "8899"
      # Identifiants de dev de camera-simulee-2, les mêmes que pour son Flux.
      ONVIF_IDENTIFIANT: admin
      ONVIF_MOT_DE_PASSE: argos-simulee
      # Version TLS la plus haute servie ; les tests la baissent à 1.0 pour simuler une caméra ancienne.
      ONVIF_TLS_MAX: ${ONVIF_TLS_MAX_2:-}
      # Service image et média 2, comme la caméra de dev ; les tests retirent le média 2 (`ONVIF_SERVICES_2=image`)
      # pour le repli média 1 sur ce Flux H.264.
      ONVIF_SERVICES: ${ONVIF_SERVICES_2-image,media2}
      # Muette ce nombre de secondes après un changement d'Encodage (vide : jamais) ; les tests le règlent pour une
      # caméra qui ne répond plus après l'envoi.
      ONVIF_SILENCE_APRES_ENCODAGE_S: ${ONVIF_SILENCE_APRES_ENCODAGE_S_2:-}
      # Port où elle joint ses serveurs NTP (vide : 123) ; les tests le détournent pour une caméra calée sur le Site
      # dont l'horloge ne se corrige pas.
      ONVIF_PORT_NTP: ${ONVIF_PORT_NTP_2:-}
      # Profils des flux principal et secondaire, aux chemins de son URL RTSP (MediaMTX ne sert que le premier).
      ONVIF_CHEMINS_RTSP: /cam/realmonitor?channel=1&subtype=0,/cam/realmonitor?channel=1&subtype=1

  camera-simulee-4-onvif:
    build: ./simulation/onvif
    restart: unless-stopped
    network_mode: service:camera-simulee-4
    volumes:
      - camera-simulee-4-horloge:/horloge
    environment:
      # Date incrustée dans le Flux de camera-simulee-4 (media/simulated/diffuser.sh).
      ONVIF_FICHIER_DATE: /horloge/date.txt
      # HTTP seulement, sans identifiants ; média 1 seul, sans service image (pas de `ONVIF_SERVICES`).
      ONVIF_PORT: "80"
      # Types d'Incrustation recréables ; les tests en retirent un pour simuler une caméra qui ne sait pas.
      ONVIF_TYPES_CREABLES: ${ONVIF_TYPES_CREABLES_4:-Plain,DateAndTime}

  # Le pont relaie les Caméras simulées déclarées vers le navigateur.
  mediamtx:
    # RTSP du pont lisible depuis la machine du développeur seulement (ffprobe, VLC), jamais du réseau local.
    ports:
      - "127.0.0.1:8554:8554"
    networks:
      - default
      - cameras-simulees

  # Le Serveur de temps du Site, joint par les Caméras simulées par le réseau Compose (sans macvlan), à une IP fixe.
  temps:
    networks:
      default:
      cameras-simulees:
        ipv4_address: 172.30.0.10

  # La sonde (et la Détection) joignent les Caméras simulées comme de vraies caméras du réseau local.
  api:
    networks:
      - default
      - cameras-simulees
    environment:
      # Complète les sous-réseaux de .env avec celui des Caméras simulées.
      ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX: ${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX:+${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX},}172.30.0.0/24
      # Les Caméras simulées sont calées sur temps, à son IP fixe sur leur réseau.
      # Surcharge possible (.env) pour caler une vraie caméra du LAN : IP du Mac (UDP 123 publié).
      ARGOS_TEMPS_ADRESSE_CAMERAS: ${ARGOS_TEMPS_ADRESSE_CAMERAS:-172.30.0.10}

volumes:
  camera-simulee-2-onvif-certificat:
  # Date de l'horloge de chaque Caméra simulée ONVIF, de son interface ONVIF vers son Flux.
  camera-simulee-2-horloge:
  camera-simulee-4-horloge:

networks:
  cameras-simulees:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Adresses dynamiques (pont, API) : hors des adresses fixes de temps (.10) et des Caméras simulées (.11 à .14).
          ip_range: 172.30.0.128/26
