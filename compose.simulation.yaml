# Simulation de dev, superposée à compose.yaml (jamais en prod) :
#   docker compose -f compose.yaml -f compose.simulation.yaml up -d --build --wait
# Trois Caméras simulées, trois hôtes distincts comme de vraies caméras : chacune diffuse sa vidéo
# (media/simulated/camN.mp4) en boucle, sans réencodage, sur rtsp://camera-simulee-N/flux (port 554).
# Aucun port publié : on les regarde par le Live, une fois déclarées comme Caméras (media/simulated/README.md).

x-camera-simulee: &camera-simulee
  image: bluenviron/mediamtx:1.21.1-ffmpeg
  restart: unless-stopped
  networks:
    - cameras-simulees
  healthcheck:
    # Prête quand la vidéo est diffusée sur son chemin.
    test: ["CMD", "ffprobe", "-v", "error", "-rtsp_transport", "tcp", "rtsp://localhost/flux"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    start_interval: 1s

services:
  camera-simulee-1:
    <<: *camera-simulee
    volumes:
      - ./media/simulated/camera-simulee.yml:/mediamtx.yml:ro
      - ./media/simulated/cam1.mp4:/media/video.mp4:ro

  camera-simulee-2:
    <<: *camera-simulee
    volumes:
      - ./media/simulated/camera-simulee.yml:/mediamtx.yml:ro
      - ./media/simulated/cam2.mp4:/media/video.mp4:ro
    environment:
      # Lecture avec identifiant et mot de passe de dev (media/simulated/README.md).
      MTX_AUTHINTERNALUSERS_0_USER: admin
      MTX_AUTHINTERNALUSERS_0_PASS: argos-simulee

  camera-simulee-3:
    <<: *camera-simulee
    volumes:
      - ./media/simulated/camera-simulee.yml:/mediamtx.yml:ro
      - ./media/simulated/cam3.mp4:/media/video.mp4:ro

  # Le pont relaie les Caméras simulées déclarées vers le navigateur.
  mediamtx:
    networks:
      - default
      - cameras-simulees

  # La sonde (et la Détection) joignent les Caméras simulées comme de vraies caméras du réseau local.
  api:
    networks:
      - default
      - cameras-simulees
    environment:
      # Complète les sous-réseaux de .env avec celui des Caméras simulées.
      ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX: ${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX:+${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX},}172.30.0.0/24

networks:
  cameras-simulees:
    ipam:
      config:
        - subnet: 172.30.0.0/24
