# Simulation de dev, superposée à compose.yaml (jamais en prod) :
#   docker compose -f compose.yaml -f compose.simulation.yaml up -d --build --wait
# Quatre Caméras simulées, quatre hôtes distincts comme de vraies caméras : chacune diffuse sa vidéo
# (media/simulated/camN.mp4) en boucle, sans réencodage, en RTSP (port 554), sur un chemin de vraie caméra :
# style Hikvision (1), style Dahua avec identifiants (2), chemin exotique `flux` (3), style Hikvision en H.265 (4).
# Aucun port publié : on les regarde par le Live, une fois déclarées comme Caméras (media/simulated/README.md).
# MAC et IP fixes, comme l'étiquette et le bail d'une vraie caméra : la Détection et l'essai les lisent.
# Les Caméras simulées 2 et 4 répondent aussi en ONVIF (simulation/onvif/README.md).

x-camera-simulee: &camera-simulee
  image: bluenviron/mediamtx:1.21.1-ffmpeg
  restart: unless-stopped
  # Remplit le gabarit camera-simulee.yml avec le chemin de la Caméra simulée, puis lance MediaMTX.
  entrypoint: ["/bin/sh", "-c", "sed \"s|^  CHEMIN_FLUX:|  $$CHEMIN_FLUX:|\" /camera-simulee.yml > /mediamtx.yml && exec /mediamtx"]
  healthcheck:
    # Prête quand la vidéo est diffusée sur son chemin.
    test: ["CMD-SHELL", "ffprobe -v error -rtsp_transport tcp \"rtsp://localhost/$$CHEMIN_FLUX\""]
    interval: 10s
    timeout: 5s
    start_period: 30s
    start_interval: 1s

services:
  camera-simulee-1:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.11
        mac_address: "02:a6:05:00:00:01"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/cam1.mp4:/media/video.mp4:ro
    environment:
      CHEMIN_FLUX: Streaming/Channels/101

  camera-simulee-2:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.12
        mac_address: "02:a6:05:00:00:02"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/cam2.mp4:/media/video.mp4:ro
    environment:
      # Lu sur rtsp://camera-simulee-2/cam/realmonitor?channel=1&subtype=0 : MediaMTX ignore la requête.
      CHEMIN_FLUX: cam/realmonitor
      # Lecture avec identifiant et mot de passe de dev (media/simulated/README.md).
      MTX_AUTHINTERNALUSERS_0_USER: admin
      MTX_AUTHINTERNALUSERS_0_PASS: argos-simulee

  camera-simulee-3:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.13
        mac_address: "02:a6:05:00:00:03"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      - ./media/simulated/cam3.mp4:/media/video.mp4:ro
    environment:
      CHEMIN_FLUX: flux

  camera-simulee-4:
    <<: *camera-simulee
    networks:
      cameras-simulees:
        ipv4_address: 172.30.0.14
        mac_address: "02:a6:05:00:00:04"
    volumes:
      - ./media/simulated/camera-simulee.yml:/camera-simulee.yml:ro
      # cam1.mp4 réencodée en H.265 : diffusée telle quelle, comme une vraie caméra HEVC.
      - ./media/simulated/cam4.mp4:/media/video.mp4:ro
    environment:
      CHEMIN_FLUX: Streaming/Channels/101

  # Interfaces ONVIF des Caméras simulées 2 et 4 (simulation/onvif/README.md) : chacune partage le réseau de sa
  # Caméra simulée, donc son IP et sa MAC, comme l'interface ONVIF d'une vraie caméra. Les 1 et 3 n'en ont pas.
  camera-simulee-2-onvif:
    build: ./simulation/onvif
    restart: unless-stopped
    network_mode: service:camera-simulee-2
    volumes:
      # Certificat auto-signé créé au premier démarrage, gardé ensuite : sa clé ne change pas d'un démarrage à l'autre.
      - camera-simulee-2-onvif-certificat:/certificat
    environment:
      # HTTPS sur 443, et HTTP gardé sur le port des caméras XiongMai, comme beaucoup de vraies caméras.
      ONVIF_PORT_HTTPS: "443"
      ONVIF_CERTIFICAT: /certificat/certificat.pem
      ONVIF_CLE: /certificat/cle.pem
      ONVIF_PORT: "8899"
      # Identifiants de dev de camera-simulee-2, les mêmes que pour son Flux.
      ONVIF_IDENTIFIANT: admin
      ONVIF_MOT_DE_PASSE: argos-simulee

  camera-simulee-4-onvif:
    build: ./simulation/onvif
    restart: unless-stopped
    network_mode: service:camera-simulee-4
    environment:
      # HTTP seulement, sans identifiants.
      ONVIF_PORT: "80"
      # Types d'Incrustation recréables ; les tests en retirent un pour simuler une caméra qui ne sait pas.
      ONVIF_TYPES_CREABLES: ${ONVIF_TYPES_CREABLES_4:-Plain,DateAndTime}

  # Le pont relaie les Caméras simulées déclarées vers le navigateur.
  mediamtx:
    # RTSP du pont lisible depuis la machine du développeur seulement (ffprobe, VLC), jamais du réseau local.
    ports:
      - "127.0.0.1:8554:8554"
    networks:
      - default
      - cameras-simulees

  # La sonde (et la Détection) joignent les Caméras simulées comme de vraies caméras du réseau local.
  api:
    networks:
      - default
      - cameras-simulees
    environment:
      # Complète les sous-réseaux de .env avec celui des Caméras simulées.
      ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX: ${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX:+${ARGOS_DETECTION_CAMERAS_SOUS_RESEAUX},}172.30.0.0/24

volumes:
  camera-simulee-2-onvif-certificat:

networks:
  cameras-simulees:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Adresses dynamiques (pont, API) : hors des adresses fixes des Caméras simulées (.11 à .14).
          ip_range: 172.30.0.128/26
